<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FloodMonitor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
<h1>FloodMonitor – Hochwasser-Frühwarnsystem</h1>

<form id="loginForm" class="box">
    <label>Benutzer <input id="user" value="viewer"></label>
    <label>Passwort <input id="password" type="password"></label>
    <label>Format
        <select id="format">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
        </select>
    </label>
    <label><input id="auto" type="checkbox" checked> alle 10 s aktualisieren</label>
    <button type="submit">Anmelden</button>
</form>

<form id="filterForm" class="box">
    <label>Station <select id="station"></select></label>
    <label>Von <input id="from" type="datetime-local"></label>
    <label>Bis <input id="to" type="datetime-local"></label>
    <label>Warnstufe
        <select id="level">
            <option value="">alle</option>
            <option>NORMAL</option>
            <option>WARNING</option>
            <option>CRITICAL</option>
            <option>UNKNOWN</option>
        </select>
    </label>
    <label>Limit <input id="limit" type="number" value="50" min="1" max="1000"></label>
    <button type="submit">Anzeigen</button>
</form>

<p>
    <span id="loading" style="display:none">Lade Daten …</span>
    <span id="updated"></span>
</p>
<p id="error" style="display:none"></p>

<div class="row">
    <div class="box">
        <h2>Aktueller Messwert</h2>
        <div id="latest">Bitte anmelden.</div>
    </div>
    <div class="box">
        <h2>Aktuelle Warnungen</h2>
        <ul id="alerts"></ul>
    </div>
</div>

<div class="box">
    <h2>Historische Messwerte</h2>
    <table>
        <thead>
        <tr>
            <th>Station</th><th>Zeitpunkt</th><th>Wasserstand</th><th>Durchflussmenge</th>
            <th>Niederschlag</th><th>Akkustand</th><th>Stationsstatus</th><th>Warnstufe</th>
        </tr>
        </thead>
        <tbody id="history"></tbody>
    </table>
</div>
</body>
</html>
