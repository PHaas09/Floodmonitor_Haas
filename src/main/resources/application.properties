server.port=8080
# keine Stacktraces an den Client schicken
server.error.include-stacktrace=never

# Simulation
simulation.enabled=true
simulation.interval=10000
simulation.history-hours=12

# Login (Passwort kann mit der Umgebungsvariable FLOODMONITOR_PASSWORD gesetzt werden)
spring.security.user.name=viewer
spring.security.user.password=${FLOODMONITOR_PASSWORD:viewer123}
spring.security.user.roles=VIEWER

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
